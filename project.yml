name: VideoCompressor
options:
  bundleIdPrefix: com.videocompressor
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  VideoCompressor:
    type: application
    platform: iOS
    sources:
      - path: VideoCompressor
        excludes:
          - "Resources/Info.plist"
          - "Resources/VideoCompressor.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videocompressor.axo
        PRODUCT_NAME: axo
        PRODUCT_MODULE_NAME: VideoCompressor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: VideoCompressor/Resources/VideoCompressor.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        # 关键：显式开启 Xcode 自动生成 Info.plist（CI 实测若置 NO 会被忽略而丢失自定义键）
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 以下全部通过 INFOPLIST_KEY_* 注入，确保编译进最终二进制（自定义键不会丢失）
        INFOPLIST_KEY_CFBundleDisplayName: axo1
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于将压缩后的视频保存到照片图库。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用于读取和管理用户选择的视频，以完成保存和删除原视频操作。"
    dependencies: []
  VideoCompressorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VideoCompressorTests
    info:
      path: VideoCompressorTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videocompressor.VideoCompressorTests
        PRODUCT_NAME: VideoCompressorTests
        CODE_SIGNING_ALLOWED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/axo.app/axo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: VideoCompressor
