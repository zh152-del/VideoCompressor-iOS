name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show SDKs
        run: xcodebuild -showsdks

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & Test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme VideoCompressor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean

      - name: Build unsigned Release (device)
        run: |
          xcodebuild build \
            -scheme VideoCompressor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name "axo.app" | head -n 1)
          echo "App path: $APP"
          if [ -z "$APP" ]; then echo "未找到 axo.app，尝试备用名称..."; APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1); fi
          echo "Final app path: $APP"
          if [ -z "$APP" ]; then echo "未找到 .app，打包中止"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r axo1-unsigned.ipa Payload
          rm -rf Payload
          ls -lh axo1-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: axo1-unsigned-ipa
          path: axo1-unsigned.ipa

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**/*.log
